name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax-check frontend modules and installer
        run: |
          for f in server/*.js public/js/*.js public/js/pages/*.js; do node --check "$f"; done
          bash -n scripts/install-lxc.sh
